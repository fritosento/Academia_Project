spring:
  application:
    name: project

  datasource:
    url: jdbc:mysql://localhost:3306/academia_db
    username: root
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  logging:
    level:
      org.hibernate.orm.jdbc.bind: trace